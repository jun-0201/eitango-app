<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>英単語テスト</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --paper: #f5f5ef;
    --ink: #23262e;
    --rule: rgba(58,95,205,0.16);
    --rule-strong: rgba(58,95,205,0.35);
    --red: #c6362b;
    --red-tint: rgba(198,54,43,0.10);
    --blue: #3a5fcd;
    --blue-tint: rgba(58,95,205,0.10);
    --muted: #8a8c82;
    --font-display: 'Zen Maru Gothic', sans-serif;
    --font-body: 'Noto Sans JP', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #e9e9e2; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px),
      linear-gradient(to right, transparent 0 44px, var(--red) 44px 45.5px, transparent 45.5px 100%);
    padding: 18px 16px 40px 54px;
  }
  .screen { display: flex; flex-direction: column; gap: 12px; }

  .brand { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .brand h1 { font-family: var(--font-display); font-weight: 900; font-size: 21px; margin: 0; }
  .subtitle { margin: 0 0 2px; font-size: 12.5px; color: var(--muted); }

  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .topbar-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; flex: 1; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--ink); padding: 4px; display: flex; font-size: 20px; line-height: 1; }

  .deck-badge {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #fff; border: 1.5px solid var(--rule); border-radius: 10px; padding: 10px 12px;
  }
  .deck-badge-name { font-weight: 700; font-size: 14px; }
  .deck-badge-meta { font-size: 11.5px; color: var(--muted); }
  .link-btn { background: none; border: none; color: var(--blue); font-weight: 700; font-size: 12.5px; cursor: pointer; padding: 4px 2px; }

  .stat-row { display: flex; gap: 8px; }
  .stat-tile {
    flex: 1; background: #fff; border: 1px solid var(--rule);
    border-radius: 10px; padding: 9px 4px; text-align: center;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-num { font-family: var(--font-display); font-weight: 900; font-size: 18px; }
  .stat-label { font-size: 10.5px; color: var(--muted); }

  .btn {
    font-family: var(--font-body); font-weight: 700; font-size: 15px;
    border-radius: 10px; padding: 13px 14px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-outline { background: #fff; color: var(--ink); border: 1.5px solid var(--rule); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); font-weight: 500; font-size: 12.5px; padding: 8px; }
  .btn-sm { padding: 9px 10px; font-size: 13px; }

  .hint, .notice { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
  .notice-ok { color: var(--blue); font-weight: 700; }
  .notice-err { color: var(--red); font-weight: 700; }
  .empty { font-size: 13px; color: var(--muted); }

  .field-label { font-size: 12px; color: var(--muted); font-weight: 700; margin: 6px 0 -4px; }
  .text-input, .textarea {
    width: 100%; border: 1.5px solid var(--rule); border-radius: 10px;
    padding: 10px 12px; font-family: var(--font-body); font-size: 14px; background: #fff;
  }
  .textarea { resize: vertical; }
  .file-input-wrap { display: flex; flex-direction: column; gap: 6px; }
  input[type=file] { font-size: 12.5px; }

  .divider { height: 1px; background: var(--rule); margin: 4px 0; }

  .deck-list { display: flex; flex-direction: column; gap: 8px; }
  .deck-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #fff; border: 1.5px solid var(--rule); border-radius: 10px; padding: 11px 12px; cursor: pointer;
  }
  .deck-row.active { border-color: var(--blue); background: var(--blue-tint); }
  .deck-row-name { font-weight: 700; font-size: 14px; }
  .deck-row-meta { font-size: 11.5px; color: var(--muted); }
  .deck-row-del { background: none; border: none; color: var(--red); font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 6px 8px; white-space: nowrap; }
  .speak-btn { background: none; border: 1.5px solid var(--rule); border-radius: 999px; color: var(--blue); font-size: 12px; cursor: pointer; padding: 3px 8px; }

  .word-list { display: flex; flex-direction: column; gap: 6px; }
  .word-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 9px 10px;
  }
  .word-text { display: flex; flex-direction: column; gap: 1px; }
  .word-en { font-weight: 700; font-size: 14px; }
  .word-ja { font-size: 12px; color: var(--muted); }

  .pill-group { display: flex; gap: 8px; }
  .pill {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 999px; border: 1.5px solid var(--rule);
    background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted);
  }
  .pill.active { border-color: var(--blue); background: var(--blue); color: #fff; }

  .setup-box { background: #fff; border: 1.5px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .setup-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .num-input { width: 64px; border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; font-size: 14px; text-align: center; }

  .card {
    position: relative; background: #fff; border: 1.5px solid var(--rule); border-radius: 14px;
    padding: 30px 14px; text-align: center; overflow: hidden;
  }
  .card-label { font-size: 11.5px; color: var(--muted); margin: 0 0 8px; }
  .card-word { font-family: var(--font-display); font-weight: 900; font-size: 25px; margin: 0; word-break: break-word; }

  .stamp-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.55); pointer-events: none;
  }
  .stamp-svg { width: 100px; height: 100px; animation: stampPop 0.4s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes stampPop {
    0% { transform: scale(2.4) rotate(-16deg); opacity: 0; }
    60% { transform: scale(0.9) rotate(-6deg); opacity: 1; }
    100% { transform: scale(1) rotate(-8deg); opacity: 1; }
  }

  .progress-label { font-size: 12px; color: var(--muted); margin: 0; }
  .progress-bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--blue); transition: width 0.3s ease; }

  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .option-btn {
    background: #fff; border: 1.5px solid var(--rule); border-radius: 10px; padding: 14px 8px;
    font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer; min-height: 54px;
  }
  .option-correct { border-color: var(--blue); background: var(--blue-tint); font-weight: 700; }
  .option-wrong { border-color: var(--red); background: var(--red-tint); text-decoration: line-through; }
  .option-dim { opacity: 0.5; }

  .result-score { display: flex; align-items: baseline; gap: 8px; justify-content: center; padding: 10px 0; }
  .result-num { font-family: var(--font-display); font-weight: 900; font-size: 40px; color: var(--red); }
  .result-slash { font-size: 14px; color: var(--muted); }

  .confirm-box { background: #fff; border: 1.5px solid var(--red); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .confirm-box p { margin: 0; font-size: 13.5px; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions .btn { padding: 10px; font-size: 13px; }

  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid var(--rule); background: #fff; border-radius: 999px; padding: 6px 11px;
    font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .chip.active { border-color: var(--red); color: var(--red); background: var(--red-tint); }

  .table-wrap { background: #fff; border: 1.5px solid var(--rule); border-radius: 10px; overflow: auto; max-height: 420px; }
  table.results-table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
  table.results-table th, table.results-table td { padding: 7px 9px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
  table.results-table th { position: sticky; top: 0; background: #fbfaf5; font-size: 11px; color: var(--muted); z-index: 1; }
  .mark-ok { color: var(--blue); font-weight: 900; }
  .mark-ng { color: var(--red); font-weight: 900; }
  .mark-none { color: var(--rule-strong); }

  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 60px 0; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ---------------- constants ---------------- */
var LS_KEY = 'vocabAppState.v2';
var MIN_WORDS = 4;
var DEFAULT_BATCH = 20;

/* ---------------- helpers ---------------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmtDate(iso) {
  var d = new Date(iso);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function parseCsvText(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  var rows = [];
  var i = 0, field = '', row = [], inQuotes = false;
  while (i < text.length) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (!(row.length === 1 && row[0] === '')) rows.push(row);
        row = [];
      } else field += c;
    }
    i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function rowsToWords(rows) {
  var out = [];
  var start = 0;
  if (rows.length && rows[0][0]) {
    var head = String(rows[0][0]).trim().toLowerCase();
    if (['english', 'en', 'word', '単語', '英単語'].indexOf(head) !== -1) start = 1;
  }
  for (var i = start; i < rows.length; i++) {
    var r = rows[i];
    if (!r || r.length < 2) continue;
    var en = (r[0] || '').trim();
    var ja = (r[1] || '').trim();
    if (!en || !ja) continue;
    out.push({ id: uid(), en: en, ja: ja });
  }
  return out;
}

function decodeCsvBuffer(buffer) {
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
  } catch (e) {
    try {
      return new TextDecoder('shift-jis').decode(buffer);
    } catch (e2) {
      try { return new TextDecoder('utf-8').decode(buffer); } catch (e3) { return ''; }
    }
  }
}

function parsePastedLines(text) {
  var lines = text.split('\n');
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var trimmed = lines[i].trim();
    if (!trimmed) continue;
    var parts = trimmed.split(/[,、]/);
    if (parts.length < 2) continue;
    var en = parts[0].trim();
    var ja = parts.slice(1).join(',').trim();
    if (!en || !ja) continue;
    out.push({ id: uid(), en: en, ja: ja });
  }
  return out;
}

/* ---------------- state ---------------- */
function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      parsed.decks = parsed.decks || [];
      parsed.progress = parsed.progress || {};
      parsed.results = parsed.results || {};
      return parsed;
    }
  } catch (e) { /* fall through */ }
  return { decks: [], activeDeckId: null, progress: {}, results: {}, lastDirection: 'en2ja' };
}
var state = loadState();
var view = { screen: 'home', notice: '', noticeType: '', draftWords: null, draftPreview: '', exitConfirm: false, deleteConfirm: null, setupMode: null, resultsFilter: 'all', resultsSearch: '', resultsVisible: 100 };
var quiz = null; /* runtime-only, not persisted */

function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    view.notice = '保存に失敗したよ(容量オーバーかも)';
    view.noticeType = 'err';
    return false;
  }
}

function setNotice(msg, type) { view.notice = msg; view.noticeType = type || 'ok'; }
function goto(screen) { view.screen = screen; view.notice = ''; render(); }

function getActiveDeck() {
  if (!state.activeDeckId) return null;
  for (var i = 0; i < state.decks.length; i++) if (state.decks[i].id === state.activeDeckId) return state.decks[i];
  return null;
}

function getProgress(deckId) {
  return state.progress[deckId] || { cursor: 0, round: 1 };
}

function getDeckResults(deckId) {
  return state.results[deckId] || {};
}

function allAttempts(deckId, wordId) {
  var r = getDeckResults(deckId);
  return (r[wordId] && r[wordId].attempts) || [];
}

function getMissedWords(deck) {
  var res = getDeckResults(deck.id);
  var missed = [];
  for (var i = 0; i < deck.words.length; i++) {
    var w = deck.words[i];
    var attempts = (res[w.id] && res[w.id].attempts) || [];
    if (!attempts.length) continue;
    var last = attempts[attempts.length - 1];
    if (!last.correct) missed.push(w);
  }
  return missed;
}

function deckOverallAccuracy(deck) {
  var res = getDeckResults(deck.id);
  var total = 0, correct = 0;
  Object.keys(res).forEach(function (wid) {
    var attempts = res[wid].attempts || [];
    total += attempts.length;
    attempts.forEach(function (a) { if (a.correct) correct++; });
  });
  return total > 0 ? Math.round((correct / total) * 100) : 0;
}

/* ---------------- audio ---------------- */
function speakWord(text) {
  if (!text) return;
  if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
    setNotice('この端末は発音の読み上げに対応していないみたい', 'err');
    render();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) { /* ignore playback errors */ }
}

/* ---------------- CSV export ---------------- */
function csvEscape(v) {
  v = String(v == null ? '' : v);
  if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function exportResultsCsv() {
  var deck = getActiveDeck();
  if (!deck) return;
  var res = getDeckResults(deck.id);
  var prog = getProgress(deck.id);
  var maxRound = prog.round;
  Object.keys(res).forEach(function (wid) {
    (res[wid].attempts || []).forEach(function (a) { if (typeof a.round === 'number' && a.round > maxRound) maxRound = a.round; });
  });
  var headers = ['英単語', '意味'];
  for (var r = 1; r <= maxRound; r++) headers.push(r + '回目');
  headers.push('復習');
  var lines = [headers.map(csvEscape).join(',')];
  deck.words.forEach(function (w) {
    var attempts = (res[w.id] && res[w.id].attempts) || [];
    var row = [w.en, w.ja];
    for (var r2 = 1; r2 <= maxRound; r2++) {
      var found = attempts.filter(function (a) { return a.round === r2; }).pop();
      row.push(found ? (found.correct ? '○' : '×') : '');
    }
    var reviewAttempts = attempts.filter(function (a) { return a.round === 'review'; });
    row.push(reviewAttempts.length ? (reviewAttempts[reviewAttempts.length - 1].correct ? '○' : '×') : '');
    lines.push(row.map(csvEscape).join(','));
  });
  var csvContent = '\uFEFF' + lines.join('\r\n');
  var filename = deck.name + '_結果.csv';
  var url;
  try {
    if (!window.Blob || !window.URL || !window.URL.createObjectURL) throw new Error('no-blob-support');
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    url = window.URL.createObjectURL(blob);
  } catch (e) {
    url = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent);
  }
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  if (url.indexOf('blob:') === 0) setTimeout(function () { window.URL.revokeObjectURL(url); }, 2000);
  setNotice('CSVを書き出したよ(開くだけの場合は共有ボタンから保存してね)', 'ok');
  render();
}

/* ---------------- render ---------------- */
function render() {
  var app = document.getElementById('app');
  var html = '';
  if (view.screen === 'home') html = renderHome();
  else if (view.screen === 'deckList') html = renderDeckList();
  else if (view.screen === 'deckAdd') html = renderDeckAdd();
  else if (view.screen === 'testSetup') html = renderTestSetup();
  else if (view.screen === 'test') html = renderTest();
  else if (view.screen === 'testResult') html = renderTestResult();
  else if (view.screen === 'results') html = renderResults();
  else html = renderHome();
  app.innerHTML = html;
}

function topBar(title, backAction) {
  return '<div class="topbar">' +
    '<button class="icon-btn" data-action="' + backAction + '" aria-label="戻る">&#8249;</button>' +
    '<span class="topbar-title">' + escapeHtml(title) + '</span>' +
    '<span style="width:20px"></span></div>';
}

function noticeHtml() {
  if (!view.notice) return '';
  var cls = view.noticeType === 'err' ? 'notice notice-err' : 'notice notice-ok';
  return '<p class="' + cls + '">' + escapeHtml(view.notice) + '</p>';
}

function renderHome() {
  var deck = getActiveDeck();
  var out = '<div class="screen">';
  out += '<div class="brand"><span style="font-size:22px">&#128218;</span><h1>英単語テスト</h1></div>';
  out += '<p class="subtitle">CSVで単語帳を読み込んで、コツコツテスト</p>';

  if (state.decks.length === 0) {
    out += '<div class="setup-box"><p style="margin:0;font-size:13.5px">まだ単語帳がないよ。CSVを読み込んで最初の単語帳を作ろう</p>' +
      '<button class="btn btn-primary" data-action="nav-deckAdd">＋ 単語帳を追加する</button></div>';
    out += '</div>';
    return out;
  }

  var prog = getProgress(deck.id);
  var acc = deckOverallAccuracy(deck);

  out += '<div class="deck-badge">' +
    '<div><div class="deck-badge-name">' + escapeHtml(deck.name) + '</div>' +
    '<div class="deck-badge-meta">' + deck.words.length + '語・Round ' + prog.round + '</div></div>' +
    '<button class="link-btn" data-action="nav-deckList">切り替え/追加</button></div>';

  out += '<div class="stat-row">' +
    '<div class="stat-tile"><span class="stat-num">' + Math.min(prog.cursor, deck.words.length) + '/' + deck.words.length + '</span><span class="stat-label">進んだ単語数</span></div>' +
    '<div class="stat-tile"><span class="stat-num">' + prog.round + '</span><span class="stat-label">周目</span></div>' +
    '<div class="stat-tile"><span class="stat-num">' + acc + '%</span><span class="stat-label">通算正答率</span></div>' +
    '</div>';

  out += noticeHtml();

  var disabled = deck.words.length < MIN_WORDS ? ' disabled' : '';
  out += '<button class="btn btn-primary" data-action="start-continue"' + disabled + '>▶ 続きのテストをする</button>';
  if (deck.words.length < MIN_WORDS) out += '<p class="hint">単語が' + MIN_WORDS + '個以上必要だよ</p>';

  out += '<button class="btn btn-outline" data-action="nav-results">今までの結果を見る</button>';
  out += '<button class="btn btn-outline" data-action="start-review">間違えた単語を学習する</button>';
  out += '</div>';
  return out;
}

function renderDeckList() {
  var out = '<div class="screen">';
  out += topBar('単語帳を選ぶ', 'nav-home');
  out += '<button class="btn btn-primary" data-action="nav-deckAdd">＋ 新しい単語帳を追加(CSV)</button>';
  out += noticeHtml();

  if (state.decks.length === 0) {
    out += '<p class="empty">まだ単語帳がないよ</p></div>';
    return out;
  }

  out += '<div class="deck-list">';
  state.decks.forEach(function (d) {
    var prog = getProgress(d.id);
    var isActive = d.id === state.activeDeckId;
    if (view.deleteConfirm === d.id) {
      out += '<div class="confirm-box"><p>「' + escapeHtml(d.name) + '」を削除します。単語とテスト結果もすべて消えるよ</p>' +
        '<div class="confirm-actions">' +
        '<button class="btn btn-outline btn-sm" data-action="deck-delete-cancel">キャンセル</button>' +
        '<button class="btn btn-danger btn-sm" data-action="deck-delete-confirm" data-id="' + d.id + '">削除する</button>' +
        '</div></div>';
    } else {
      out += '<div class="deck-row' + (isActive ? ' active' : '') + '" data-action="deck-select" data-id="' + d.id + '">' +
        '<div><div class="deck-row-name">' + escapeHtml(d.name) + (isActive ? '(使用中)' : '') + '</div>' +
        '<div class="deck-row-meta">' + d.words.length + '語・Round ' + prog.round + '</div></div>' +
        '<button class="deck-row-del" data-action="deck-delete-request" data-id="' + d.id + '">&#128465; 削除</button>' +
        '</div>';
    }
  });
  out += '</div></div>';
  return out;
}

function renderDeckAdd() {
  var out = '<div class="screen">';
  out += topBar('単語帳を追加', 'nav-deckList');

  out += '<label class="field-label">単語帳の名前</label>';
  out += '<input class="text-input" id="deckNameInput" type="text" placeholder="例: DUO、database3300、自作リストなど" value="' + escapeHtml(view.deckNameDraft || '') + '">';

  out += '<label class="field-label">CSVファイルを読み込む(1列目=英単語、2列目=意味)</label>';
  out += '<div class="file-input-wrap"><input type="file" id="csvFileInput" accept=".csv,text/csv"></div>';

  out += '<label class="field-label">またはテキストを貼り付け(1行に「英単語,意味」)</label>';
  out += '<textarea class="textarea" id="pasteTextarea" rows="4" placeholder="apple,りんご&#10;resilient,回復力のある">' + escapeHtml(view.pasteDraft || '') + '</textarea>';
  out += '<button class="btn btn-outline btn-sm" data-action="deck-add-parse-text">このテキストを読み込む</button>';

  if (view.draftPreview) out += '<p class="notice notice-ok">' + escapeHtml(view.draftPreview) + '</p>';
  out += noticeHtml();

  out += '<button class="btn btn-primary" data-action="deck-add-submit">この内容で単語帳を追加する</button>';
  out += '</div>';
  return out;
}

function renderTestSetup() {
  var deck = getActiveDeck();
  var mode = view.setupMode;
  var out = '<div class="screen">';
  out += topBar(mode === 'review' ? '間違えた単語を学習' : '続きのテスト', 'nav-home');

  var batch = view.batchSize || DEFAULT_BATCH;
  var infoLine = '';
  var count = 0;
  if (mode === 'continue') {
    var prog = getProgress(deck.id);
    var remaining = deck.words.length - prog.cursor;
    var roundLabel = prog.round;
    if (remaining <= 0) { remaining = deck.words.length; roundLabel = prog.round + 1; }
    count = Math.min(batch, remaining);
    infoLine = 'Round ' + roundLabel + '・今回は ' + count + '問';
  } else {
    var missed = getMissedWords(deck);
    count = Math.min(batch, missed.length);
    infoLine = '間違えた単語: ' + missed.length + '語中、今回は ' + count + '問';
    if (missed.length === 0) {
      out += '<p class="empty">今のところ間違えた単語はないよ。すごい!</p>';
      out += '<button class="btn btn-outline" data-action="nav-home">ホームに戻る</button></div>';
      return out;
    }
  }

  out += '<div class="setup-box">';
  out += '<p style="margin:0;font-size:13px;color:var(--muted)">' + infoLine + '</p>';
  out += '<label class="field-label" style="margin-top:0">出題方向</label>';
  out += '<div class="pill-group">' +
    '<div class="pill' + (state.lastDirection === 'en2ja' ? ' active' : '') + '" data-action="setup-direction" data-dir="en2ja">英語 → 日本語</div>' +
    '<div class="pill' + (state.lastDirection === 'ja2en' ? ' active' : '') + '" data-action="setup-direction" data-dir="ja2en">日本語 → 英語</div>' +
    '</div>';
  out += '<div class="setup-row"><span class="field-label" style="margin:0">1回のテスト問題数</span>' +
    '<input class="num-input" id="batchSizeInput" type="number" min="5" max="50" value="' + batch + '"></div>';
  out += '</div>';

  out += '<button class="btn btn-primary" data-action="setup-begin">開始する(' + count + '問)</button>';
  out += '</div>';
  return out;
}

function renderTest() {
  var out = '<div class="screen">';
  out += topBar('テスト中', 'test-exit-request');

  if (view.exitConfirm) {
    out += '<div class="confirm-box"><p>テストをやめますか?ここまで答えた分は保存されるよ</p>' +
      '<div class="confirm-actions">' +
      '<button class="btn btn-outline" data-action="test-exit-cancel">続ける</button>' +
      '<button class="btn btn-danger" data-action="test-exit-confirm">やめて保存</button>' +
      '</div></div></div>';
    return out;
  }

  var q = quiz.questions[quiz.index];
  out += '<p class="progress-label">問題 ' + (quiz.index + 1) + ' / ' + quiz.questions.length + '</p>';
  out += '<div class="progress-bar"><div class="progress-fill" style="width:' + ((quiz.index / quiz.questions.length) * 100) + '%"></div></div>';

  out += '<div class="card">';
  if (quiz.feedback) {
    out += '<div class="stamp-overlay">' + (quiz.feedback === 'correct'
      ? '<svg viewBox="0 0 100 100" class="stamp-svg"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--red)" stroke-width="7" stroke-linecap="round"/></svg>'
      : '<svg viewBox="0 0 100 100" class="stamp-svg"><line x1="20" y1="20" x2="80" y2="80" stroke="var(--red)" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="20" x2="20" y2="80" stroke="var(--red)" stroke-width="7" stroke-linecap="round"/></svg>') +
      '</div>';
  }
  out += '<p class="card-label">' + (q.direction === 'en2ja' ? 'この単語の意味は?' : 'この日本語にあたる英単語は?') + '</p>';
  out += '<p class="card-word">' + escapeHtml(q.prompt) + '</p>';
  out += '<button class="speak-btn" data-action="speak" data-text="' + escapeHtml(q.en) + '">&#128266; 発音を聞く</button>';
  out += '</div>';

  out += '<div class="options-grid">';
  q.options.forEach(function (opt, idx) {
    var cls = 'option-btn';
    if (quiz.selected !== null) {
      if (opt === q.correct) cls += ' option-correct';
      else if (opt === quiz.selected) cls += ' option-wrong';
      else cls += ' option-dim';
    }
    out += '<button class="' + cls + '" data-action="answer" data-idx="' + idx + '"' + (quiz.selected !== null ? ' disabled' : '') + '>' + escapeHtml(opt) + '</button>';
  });
  out += '</div></div>';
  return out;
}

function renderTestResult() {
  var s = view.lastSession;
  var out = '<div class="screen">';
  out += topBar('テスト結果', 'nav-home');
  out += '<div class="result-score"><span class="result-num">' + s.correct + '</span><span class="result-slash">/ ' + s.total + ' 正解</span></div>';

  var wrong = s.answers.filter(function (a) { return !a.correct; });
  if (wrong.length) {
    out += '<p class="field-label">間違えた単語</p><div class="word-list">';
    wrong.forEach(function (a) {
      out += '<div class="word-row"><div class="word-text"><span class="word-en">' + escapeHtml(a.en) + '</span><span class="word-ja">' + escapeHtml(a.ja) + '</span></div>' +
        '<button class="speak-btn" data-action="speak" data-text="' + escapeHtml(a.en) + '">&#128266;</button></div>';
    });
    out += '</div>';
  } else {
    out += '<p class="notice notice-ok">全問正解!すごいね</p>';
  }

  out += '<button class="btn btn-primary" data-action="start-continue">▶ 続きのテストをする</button>';
  out += '<button class="btn btn-outline" data-action="nav-home">ホームに戻る</button>';
  out += '</div>';
  return out;
}

function renderResults() {
  var deck = getActiveDeck();
  var out = '<div class="screen">';
  out += topBar('今までの結果', 'nav-home');

  if (!deck) { out += '<p class="empty">単語帳がないよ</p></div>'; return out; }

  var prog = getProgress(deck.id);
  var acc = deckOverallAccuracy(deck);
  out += '<div class="stat-row">' +
    '<div class="stat-tile"><span class="stat-num">' + deck.words.length + '</span><span class="stat-label">単語数</span></div>' +
    '<div class="stat-tile"><span class="stat-num">' + prog.round + '</span><span class="stat-label">周目</span></div>' +
    '<div class="stat-tile"><span class="stat-num">' + acc + '%</span><span class="stat-label">通算正答率</span></div></div>';

  out += '<button class="btn btn-outline btn-sm" data-action="results-export">&#128190; 結果をCSVで書き出す</button>';
  out += noticeHtml();

  out += '<input class="text-input" id="resultsSearchInput" type="text" placeholder="英単語で検索" value="' + escapeHtml(view.resultsSearch) + '">';
  out += '<div class="filter-row">' +
    chip('all', 'すべて') + chip('attempted', '出題済みのみ') + chip('weak', '苦手のみ') +
    '</div>';

  var res = getDeckResults(deck.id);
  var maxRound = prog.round;
  Object.keys(res).forEach(function (wid) {
    (res[wid].attempts || []).forEach(function (a) { if (typeof a.round === 'number' && a.round > maxRound) maxRound = a.round; });
  });

  var rows = deck.words.filter(function (w) {
    if (view.resultsSearch) {
      var q = view.resultsSearch.toLowerCase();
      if (w.en.toLowerCase().indexOf(q) === -1 && w.ja.indexOf(q) === -1) return false;
    }
    var attempts = (res[w.id] && res[w.id].attempts) || [];
    if (view.resultsFilter === 'attempted' && attempts.length === 0) return false;
    if (view.resultsFilter === 'weak') {
      if (!attempts.length) return false;
      if (attempts[attempts.length - 1].correct) return false;
    }
    return true;
  });

  out += '<div class="table-wrap"><table class="results-table"><thead><tr><th>単語</th><th>意味</th><th>発音</th>';
  for (var r = 1; r <= maxRound; r++) out += '<th>' + r + '回目</th>';
  out += '<th>復習</th></tr></thead><tbody>';

  var visible = rows.slice(0, view.resultsVisible);
  visible.forEach(function (w) {
    var attempts = (res[w.id] && res[w.id].attempts) || [];
    out += '<tr><td>' + escapeHtml(w.en) + '</td><td>' + escapeHtml(w.ja) + '</td>' +
      '<td><button class="speak-btn" data-action="speak" data-text="' + escapeHtml(w.en) + '">&#128266;</button></td>';
    for (var r2 = 1; r2 <= maxRound; r2++) {
      var found = attempts.filter(function (a) { return a.round === r2; }).pop();
      if (!found) out += '<td class="mark-none">-</td>';
      else out += '<td class="' + (found.correct ? 'mark-ok' : 'mark-ng') + '">' + (found.correct ? '◯' : '×') + '</td>';
    }
    var reviewAttempts = attempts.filter(function (a) { return a.round === 'review'; });
    if (!reviewAttempts.length) out += '<td class="mark-none">-</td>';
    else {
      var lastRev = reviewAttempts[reviewAttempts.length - 1];
      out += '<td class="' + (lastRev.correct ? 'mark-ok' : 'mark-ng') + '">' + (lastRev.correct ? '◯' : '×') + '</td>';
    }
    out += '</tr>';
  });
  out += '</tbody></table></div>';

  if (rows.length === 0) out += '<p class="empty">該当する単語がないよ</p>';
  if (rows.length > view.resultsVisible) out += '<button class="btn btn-outline btn-sm" data-action="results-loadmore">もっと見る(残り' + (rows.length - view.resultsVisible) + '語)</button>';

  out += '</div>';
  return out;

  function chip(key, label) {
    return '<div class="chip' + (view.resultsFilter === key ? ' active' : '') + '" data-action="results-filter" data-key="' + key + '">' + label + '</div>';
  }
}

/* ---------------- quiz logic ---------------- */
function buildQuestion(word, allWords, direction) {
  var promptText = direction === 'en2ja' ? word.en : word.ja;
  var correct = direction === 'en2ja' ? word.ja : word.en;
  var pool = allWords.filter(function (w) { return w.id !== word.id; });
  var distractors = shuffle(pool).slice(0, 3).map(function (w) { return direction === 'en2ja' ? w.ja : w.en; });
  var options = shuffle([correct].concat(distractors));
  return { wordId: word.id, en: word.en, ja: word.ja, prompt: promptText, correct: correct, options: options, direction: direction };
}

function beginQuizSession() {
  var deck = getActiveDeck();
  var direction = state.lastDirection;
  var batch = view.batchSize || DEFAULT_BATCH;
  var mode = view.setupMode;
  var wordsBatch, roundNumber, startCursor = null;

  if (mode === 'continue') {
    var prog = getProgress(deck.id);
    if (prog.cursor >= deck.words.length) prog = { cursor: 0, round: prog.round + 1 };
    startCursor = prog.cursor;
    roundNumber = prog.round;
    wordsBatch = deck.words.slice(startCursor, startCursor + batch);
  } else {
    var missed = getMissedWords(deck);
    wordsBatch = missed.slice(0, batch);
    roundNumber = 'review';
  }

  var questions = wordsBatch.map(function (w) { return buildQuestion(w, deck.words, direction); });
  quiz = { questions: questions, index: 0, answers: [], selected: null, feedback: null, mode: mode, roundNumber: roundNumber, startCursor: startCursor, deckId: deck.id };
  view.exitConfirm = false;
  goto('test');
}

function commitAnswers(qs) {
  var deckId = qs.deckId;
  if (!state.results[deckId]) state.results[deckId] = {};
  qs.answers.forEach(function (a) {
    if (!state.results[deckId][a.wordId]) state.results[deckId][a.wordId] = { attempts: [] };
    state.results[deckId][a.wordId].attempts.push({ round: qs.roundNumber, correct: a.correct, date: new Date().toISOString() });
  });
  if (qs.mode === 'continue') {
    state.progress[deckId] = { cursor: qs.startCursor + qs.answers.length, round: qs.roundNumber };
  }
  saveState();
}

function handleAnswerSelect(idx) {
  if (quiz.selected !== null) return;
  var q = quiz.questions[quiz.index];
  var opt = q.options[idx];
  var isCorrect = opt === q.correct;
  quiz.selected = opt;
  quiz.feedback = isCorrect ? 'correct' : 'wrong';
  quiz.answers.push({ wordId: q.wordId, en: q.en, ja: q.ja, correct: isCorrect });
  render();

  setTimeout(function () {
    if (!quiz) return;
    if (quiz.index + 1 < quiz.questions.length) {
      quiz.index++;
      quiz.selected = null;
      quiz.feedback = null;
      render();
    } else {
      finishQuiz();
    }
  }, 950);
}

function finishQuiz() {
  var qs = quiz;
  commitAnswers(qs);
  var correct = qs.answers.filter(function (a) { return a.correct; }).length;
  view.lastSession = { correct: correct, total: qs.answers.length, answers: qs.answers };
  quiz = null;
  goto('testResult');
}

function exitQuizConfirmed() {
  if (quiz && quiz.answers.length > 0) commitAnswers(quiz);
  quiz = null;
  goto('home');
}

/* ---------------- actions ---------------- */
function handleAction(action, ds, targetEl) {
  if (action === 'nav-home') goto('home');
  else if (action === 'nav-deckList') goto('deckList');
  else if (action === 'nav-deckAdd') { view.draftWords = null; view.draftPreview = ''; view.deckNameDraft = ''; view.pasteDraft = ''; goto('deckAdd'); }
  else if (action === 'nav-results') { view.resultsFilter = 'all'; view.resultsSearch = ''; view.resultsVisible = 100; goto('results'); }

  else if (action === 'deck-select') { state.activeDeckId = ds.id; saveState(); goto('home'); }
  else if (action === 'deck-delete-request') { view.deleteConfirm = ds.id; render(); }
  else if (action === 'deck-delete-cancel') { view.deleteConfirm = null; render(); }
  else if (action === 'deck-delete-confirm') {
    state.decks = state.decks.filter(function (d) { return d.id !== ds.id; });
    delete state.progress[ds.id];
    delete state.results[ds.id];
    if (state.activeDeckId === ds.id) state.activeDeckId = state.decks.length ? state.decks[0].id : null;
    view.deleteConfirm = null;
    saveState();
    render();
  }

  else if (action === 'deck-add-parse-text') {
    var text = view.pasteDraft || '';
    var words = parsePastedLines(text);
    if (!words.length) { setNotice('「英単語,意味」の形で入力してね', 'err'); render(); return; }
    view.draftWords = words;
    view.draftPreview = words.length + '件読み込みました';
    render();
  }
  else if (action === 'deck-add-submit') {
    var name = (view.deckNameDraft || '').trim();
    if (!view.draftWords || !view.draftWords.length) { setNotice('CSVを選ぶか、テキストを読み込んでね', 'err'); render(); return; }
    if (!name) name = '単語帳' + (state.decks.length + 1);
    var newDeck = { id: uid(), name: name, words: view.draftWords, createdAt: new Date().toISOString() };
    state.decks.push(newDeck);
    state.activeDeckId = newDeck.id;
    state.progress[newDeck.id] = { cursor: 0, round: 1 };
    view.draftWords = null; view.draftPreview = '';
    saveState();
    setNotice(name + ' を追加したよ(' + newDeck.words.length + '語)', 'ok');
    goto('deckList');
  }

  else if (action === 'start-continue') { view.setupMode = 'continue'; view.batchSize = view.batchSize || DEFAULT_BATCH; goto('testSetup'); }
  else if (action === 'start-review') { view.setupMode = 'review'; view.batchSize = view.batchSize || DEFAULT_BATCH; goto('testSetup'); }
  else if (action === 'setup-direction') { state.lastDirection = ds.dir; saveState(); render(); }
  else if (action === 'setup-begin') {
    var bsEl = document.getElementById('batchSizeInput');
    var bs = bsEl ? parseInt(bsEl.value, 10) : DEFAULT_BATCH;
    if (!bs || bs < 5) bs = 5;
    if (bs > 50) bs = 50;
    view.batchSize = bs;
    beginQuizSession();
  }

  else if (action === 'answer') { handleAnswerSelect(parseInt(ds.idx, 10)); }
  else if (action === 'test-exit-request') { view.exitConfirm = true; render(); }
  else if (action === 'test-exit-cancel') { view.exitConfirm = false; render(); }
  else if (action === 'test-exit-confirm') { exitQuizConfirmed(); }

  else if (action === 'results-filter') { view.resultsFilter = ds.key; view.resultsVisible = 100; render(); }
  else if (action === 'results-loadmore') { view.resultsVisible += 100; render(); }
  else if (action === 'results-export') { exportResultsCsv(); }
  else if (action === 'speak') { speakWord(ds.text); }
}

/* ---------------- event wiring ---------------- */
document.getElementById('app').addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  handleAction(el.dataset.action, el.dataset, el);
});

document.getElementById('app').addEventListener('change', function (e) {
  if (e.target && e.target.id === 'csvFileInput') {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = decodeCsvBuffer(reader.result);
      var rows = parseCsvText(text);
      var words = rowsToWords(rows);
      if (!words.length) { setNotice('CSVを読み取れなかったよ。1列目=英単語、2列目=意味の形にしてね', 'err'); render(); return; }
      view.draftWords = words;
      view.draftPreview = words.length + '件読み込みました';
      render();
    };
    reader.onerror = function () { setNotice('ファイルの読み込みに失敗したよ', 'err'); render(); };
    reader.readAsArrayBuffer(file);
  }
});

document.getElementById('app').addEventListener('input', function (e) {
  if (!e.target) return;
  if (e.target.id === 'resultsSearchInput') {
    view.resultsSearch = e.target.value;
    view.resultsVisible = 100;
    render();
  } else if (e.target.id === 'deckNameInput') {
    view.deckNameDraft = e.target.value;
  } else if (e.target.id === 'pasteTextarea') {
    view.pasteDraft = e.target.value;
  } else if (e.target.id === 'batchSizeInput') {
    view.batchSize = e.target.value;
  }
});

/* ---------------- init ---------------- */
if (!state.activeDeckId && state.decks.length) state.activeDeckId = state.decks[0].id;
render();
</script>
